[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"          # verified on Robinhood Chain (docs/ZINCIR_DOGRULAMA.md)
optimizer = true
optimizer_runs = 200
# Robinhood Chain accepts 96 KB runtime code (verified on 4663 and 46630, docs/ZINCIR_DOGRULAMA.md;
# ADR-011). Tests and size checks use the chain's limit, not EIP-170's 24 KB.
code_size_limit = 98304
# Off: Foundry 1.8 otherwise rewrites `new X()` in tests to vm.deployCode, which Halmos cannot run.
dynamic_test_linking = false
fs_permissions = [
    { access = "read", path = "../sim/vectors" },
    { access = "read", path = "./test/fixtures" }, # on-chain Uniswap v4 PoolManager runtime code
    { access = "read", path = "./out" }, # ABI checks (no liquidity-removal function, invariant L1)
    { access = "write", path = "../deployments" }, # Deploy.s.sol output
]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "solady/=lib/solady/src/",
    "@uniswap/v4-core/=lib/v4-core/",
]

[profile.mutation]
# audits/mutation/run.sh: same code, lighter fuzzing so each mutant runs fast.
[profile.mutation.fuzz]
runs = 256

[profile.mutation.invariant]
runs = 32
depth = 50

[profile.coverage]
# CI coverage gate: the same tests with lighter fuzzing. Coverage builds are unoptimized and
# instrumented; with 10k fuzz runs they starved the laptop runner (the full fuzz run is the step
# before, in the default profile).
[profile.coverage.fuzz]
runs = 1000

[profile.coverage.invariant]
runs = 100
depth = 100
fail_on_revert = false

[profile.default.fuzz]
runs = 10000

[profile.default.invariant]
runs = 1000
depth = 100
fail_on_revert = false

# Nightly / pre-review campaigns.
[profile.deep.fuzz]
runs = 100000

[profile.deep.invariant]
runs = 5000
depth = 200

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
