name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Runners and campaign length: repository variables CI_RUNS_ON (see ci.yml) and
# FUZZ_SECONDS (Medusa; shorter on the founder's machine).

jobs:
  deep-fuzz:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Deep fuzz and invariant campaign
        run: FOUNDRY_PROFILE=deep forge test -vv

  property-fuzzers:
    # Activates once Phase 2 adds test/recon/CryticTester.sol (Chimera layout).
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check for property harness
        id: harness
        run: |
          if [ -f test/recon/CryticTester.sol ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: foundry-rs/foundry-toolchain@v1
        if: steps.harness.outputs.present == 'true'
        with:
          version: v1.8.5
      - uses: actions/setup-go@v5
        if: steps.harness.outputs.present == 'true'
        with:
          go-version: "1.24"
      - uses: actions/setup-python@v5
        if: steps.harness.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Medusa (FUZZ_SECONDS, default 6h)
        if: steps.harness.outputs.present == 'true'
        run: |
          go install github.com/crytic/medusa@latest
          pip install crytic-compile
          "$(go env GOPATH)/bin/medusa" fuzz --timeout ${{ vars.FUZZ_SECONDS || 21600 }}
      - name: Echidna
        if: steps.harness.outputs.present == 'true'
        uses: crytic/echidna-action@v2
        with:
          files: contracts
          contract: CryticTester
          config: contracts/echidna.yaml
      - name: Echidna (market layer)
        if: steps.harness.outputs.present == 'true'
        uses: crytic/echidna-action@v2
        with:
          files: contracts
          contract: CryticMarketTester
          config: contracts/echidna.yaml
