name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Format
        run: forge fmt --check
      - name: Lint
        run: forge lint
      - name: Build (with sizes)
        run: forge build --sizes
      - name: SDK ABIs match the build (packages/sdk/src/abi)
        run: node ../tools/gen_abis.mjs --check
      - name: Test (fuzz 10k, invariant 1k)
        run: forge test -vv
      - name: Coverage gate (src >= 95% lines and branches)
        run: |
          # Coverage builds are unoptimized and instrumented: test contracts that embed MiningCore's
          # creation code outgrow the 96 KB chain limit there. Size checks happen in the build step.
          forge coverage --report lcov --report-file lcov.info --no-match-coverage "(test|script)/" --code-size-limit 300000
          python3 ../tools/check_coverage.py lcov.info

  formal:
    # Halmos symbolic proofs (functions named prove_*); needs Linux (does not install on Windows).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install halmos
      - name: Halmos
        run: halmos --function prove_

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: crytic/slither-action@v0.4.0
        with:
          target: contracts
          slither-config: contracts/slither.config.json
          fail-on: medium

  aderyn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Aderyn
        working-directory: contracts
        run: |
          npm install -g @cyfrin/aderyn
          aderyn . --output aderyn-report.md
          if grep -q "^## H-" aderyn-report.md; then echo "High severity findings"; cat aderyn-report.md; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aderyn-report
          path: contracts/aderyn-report.md

  sim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Dead code (vulture)
        run: vulture engine tests run_scenarios.py make_vectors.py --min-confidence 80
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Vectors are reproducible
        run: |
          python make_vectors.py
          git diff --exit-code -- vectors/

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build, typecheck, lint, test
        run: npx turbo run build typecheck lint test
      - name: Dead code (knip)
        run: npx knip
      - name: Copy lint (docs/05 §6)
        run: node tools/lint_copy.mjs --self-test && node tools/lint_copy.mjs
      - name: Format
        run: npx prettier --check .

  keeper-e2e:
    # Keeper on a local anvil chain with time travel: real deploy script, PoolManager bytecode,
    # indexer and keeper on Postgres, plus the two-keeper lock (services/keeper/test/e2e).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx turbo run build --filter=@mohonaut/keeper...
      - name: End-to-end
        working-directory: services/keeper
        run: npx vitest run test/e2e
        env:
          KEEPER_E2E: "1"
          KEEPER_E2E_PG_URL: postgres://postgres:postgres@localhost:5432/postgres

  monitoring:
    # Validates the monitoring stack and unit-tests the alert rules (infra/monitoring).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus config
        run: docker run --rm -v "$PWD/infra/monitoring/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Alert rule unit tests
        run: docker run --rm -v "$PWD/infra/monitoring/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.5.0 test rules /etc/prometheus/tests/mohonaut_test.yml
      - name: Alertmanager config
        run: docker run --rm -v "$PWD/infra/monitoring/alertmanager:/etc/alertmanager:ro" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Loki config
        run: docker run --rm -v "$PWD/infra/monitoring/loki:/etc/loki:ro" grafana/loki:3.5.0 -config.file=/etc/loki/loki.yml -verify-config
      - name: Alloy config
        run: docker run --rm -v "$PWD/infra/monitoring/alloy:/etc/alloy:ro" grafana/alloy:v1.9.0 fmt /etc/alloy/config.alloy
      - name: Compose file
        run: docker compose -f infra/monitoring/docker-compose.yml config -q
      - name: Dashboards are generated
        run: python3 tools/gen_dashboards.py --check

  web-e2e:
    # Playwright in its official Linux image: behaviour, axe accessibility scan and visual
    # snapshots of the static export. New screenshots are written (--update-snapshots=missing)
    # and uploaded; commit them from the artifact to make them baselines.
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx turbo run build --filter=@mohonaut/web...
      - name: Playwright
        working-directory: apps/web
        env:
          VISUAL: "1"
          HOME: /root
        run: npx playwright test --update-snapshots=missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e
          path: |
            apps/web/playwright-report
            apps/web/e2e/__screenshots__

  web-play-e2e:
    # The game client against a local anvil deployment (apps/web/e2e/play): the real deploy
    # script, a build pointed at it and the wallet mock connector buying diesel and running rigs.
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx turbo run build --filter=@mohonaut/sdk
      - name: Playwright (local chain)
        working-directory: apps/web
        env:
          HOME: /root
        run: npm run e2e:play
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-play-e2e
          path: apps/web/playwright-report

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dependency audit
        run: npm audit --audit-level=high
