name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Format
        run: forge fmt --check
      - name: Lint
        run: forge lint
      - name: Build (with sizes)
        run: forge build --sizes
      - name: SDK ABIs match the build (packages/sdk/src/abi)
        run: node ../tools/gen_abis.mjs --check
      - name: Test (fuzz 10k, invariant 1k)
        run: forge test -vv
      - name: Coverage gate (src >= 95% lines and branches)
        run: |
          # Coverage builds are unoptimized and instrumented: test contracts that embed MiningCore's
          # creation code outgrow the 96 KB chain limit there. Size checks happen in the build step.
          forge coverage --report lcov --report-file lcov.info --no-match-coverage "(test|script)/" --code-size-limit 300000
          python3 ../tools/check_coverage.py lcov.info

  formal:
    # Halmos symbolic proofs (functions named prove_*); needs Linux (does not install on Windows).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install halmos
      - name: Halmos
        run: halmos --function prove_

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: crytic/slither-action@v0.4.0
        with:
          target: contracts
          slither-config: contracts/slither.config.json
          fail-on: medium

  aderyn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - name: Aderyn
        working-directory: contracts
        run: |
          npm install -g @cyfrin/aderyn
          aderyn . --output aderyn-report.md
          if grep -q "^## H-" aderyn-report.md; then echo "High severity findings"; cat aderyn-report.md; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aderyn-report
          path: contracts/aderyn-report.md

  sim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Dead code (vulture)
        run: vulture engine tests run_scenarios.py make_vectors.py --min-confidence 80
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Vectors are reproducible
        run: |
          python make_vectors.py
          git diff --exit-code -- vectors/

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build, typecheck, lint, test
        run: npx turbo run build typecheck lint test
      - name: Dead code (knip)
        run: npx knip
      - name: Copy lint (docs/05 §6)
        run: node tools/lint_copy.mjs --self-test && node tools/lint_copy.mjs
      - name: Format
        run: npx prettier --check .

  keeper-e2e:
    # Keeper on a local anvil chain with time travel: real deploy script, PoolManager bytecode,
    # indexer and keeper on Postgres, plus the two-keeper lock (services/keeper/test/e2e).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx turbo run build --filter=@mohonaut/keeper...
      - name: End-to-end
        working-directory: services/keeper
        run: npx vitest run test/e2e
        env:
          KEEPER_E2E: "1"
          KEEPER_E2E_PG_URL: postgres://postgres:postgres@localhost:5432/postgres

  monitoring:
    # Validates the monitoring stack and unit-tests the alert rules (infra/monitoring).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus config
        run: docker run --rm -v "$PWD/infra/monitoring/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Alert rule unit tests
        run: docker run --rm -v "$PWD/infra/monitoring/prometheus:/etc/prometheus:ro" --entrypoint promtool prom/prometheus:v3.5.0 test rules /etc/prometheus/tests/mohonaut_test.yml
      - name: Alertmanager config
        run: docker run --rm -v "$PWD/infra/monitoring/alertmanager:/etc/alertmanager:ro" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Loki config
        run: docker run --rm -v "$PWD/infra/monitoring/loki:/etc/loki:ro" grafana/loki:3.5.0 -config.file=/etc/loki/loki.yml -verify-config
      - name: Alloy config
        run: docker run --rm -v "$PWD/infra/monitoring/alloy:/etc/alloy:ro" grafana/alloy:v1.9.0 fmt /etc/alloy/config.alloy
      - name: Compose file
        run: docker compose -f infra/monitoring/docker-compose.yml config -q
      - name: Dashboards are generated
        run: python3 tools/gen_dashboards.py --check

  web-e2e:
    # Playwright in its official Linux image: behaviour, axe accessibility scan and visual
    # snapshots of the static export. New screenshots are written (--update-snapshots=missing)
    # and uploaded; commit them from the artifact to make them baselines.
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx turbo run build --filter=@mohonaut/web...
      - name: Playwright
        working-directory: apps/web
        env:
          VISUAL: "1"
          HOME: /root
        run: npx playwright test --update-snapshots=missing
      - name: Bundle budget
        working-directory: apps/web
        run: npm run budget
      - name: Lighthouse (mobile; performance >= 85, accessibility >= 95)
        working-directory: apps/web
        env:
          HOME: /root
        run: npm run lighthouse -- --json lighthouse.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e
          path: |
            apps/web/playwright-report
            apps/web/e2e/__screenshots__
            apps/web/lighthouse.json

  web-play-e2e:
    # The game client against a local anvil deployment (apps/web/e2e/play): the real deploy
    # script, the indexer and the API, a build pointed at them and the wallet mock connector
    # (diesel, rigs, SIWE, crew, Survey, profile, alerts).
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx turbo run build --filter=@mohonaut/api...
      - name: Playwright (local chain)
        working-directory: apps/web
        env:
          HOME: /root
        run: npm run e2e:play
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-play-e2e
          path: apps/web/playwright-report

  infra:
    # Back-end infrastructure (infra/, docs/06 6.1): service images build and the API image
    # serves; compose, cloud-init and scripts validate; an encrypted backup of a real schema
    # restores with matching row counts (Kapı 6, restore half).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build service images
        run: |
          for s in api indexer keeper; do
            docker buildx build --load -f infra/docker/Dockerfile --build-arg SERVICE=$s \
              --cache-from type=gha,scope=$s --cache-to type=gha,mode=max,scope=$s \
              -t mohonaut-$s:ci .
          done
      - name: Images start
        run: |
          docker network create ci
          docker run -d --name pg --network ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=mohonaut \
            -p 5432:5432 postgres:17-bookworm
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 2; done
          docker run -d --name api --network ci -p 8787:8787 --read-only --tmpfs /tmp \
            -v "$PWD/deployments:/deployments:ro" \
            -e NODE_ENV=development -e HOST=0.0.0.0 -e PORT=8787 \
            -e DATABASE_URL=postgres://postgres:ci@pg:5432/mohonaut \
            -e DEPLOYMENT_FILE=/deployments/46630.json -e WEB_ORIGIN=https://mohonaut.com \
            -e SURVEY_SECRET=$(openssl rand -hex 32) mohonaut-api:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8787/world | jq -e '.depth.mm == "0"'
          curl -fsS http://127.0.0.1:8787/openapi.json | jq -e '.info.title == "Mohonaut API"'
          for s in indexer keeper; do
            docker run --rm mohonaut-$s:ci node --check dist/main.js
          done
          docker logs api | tail -5
      - name: Compose, image tags, cloud-init and shell scripts
        run: |
          mkdir -p /tmp/secrets
          ENV_FILE=infra/stack/secrets.example.env SECRETS_DIR=/tmp/secrets \
            docker compose -f infra/stack/compose.yml config -q
          docker pull -q cloudflare/cloudflared:2025.4.0
          docker pull -q valkey/valkey:8-bookworm
          sudo apt-get install -y -qq cloud-init age >/dev/null
          cloud-init schema --config-file infra/server/cloud-init.yaml
          shellcheck infra/stack/deploy.sh infra/backup/*.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx turbo run build --filter=@mohonaut/api...
      - name: Backup and restore test
        run: |
          node infra/backup/ci-seed.mjs postgres://postgres:ci@127.0.0.1:5432/mohonaut
          age-keygen -o /tmp/age.key 2>/dev/null
          age-keygen -y /tmp/age.key > /tmp/recipients.txt
          AGE_RECIPIENTS_FILE=/tmp/recipients.txt BACKUP_DIR=/tmp/backups \
            PG_DUMP="docker exec -i pg pg_dump" PGURL="postgresql:///mohonaut?user=postgres" \
            infra/backup/backup.sh
          backup=$(ls /tmp/backups/*.dump.age | head -1)
          if grep -q "audit_log" "$backup"; then echo "backup is not encrypted"; exit 1; fi
          PG_RESTORE="docker exec -i pg pg_restore" PSQL="docker exec -i pg psql" \
            infra/backup/restore-test.sh "$backup" /tmp/age.key \
            "postgresql:///scratch?user=postgres" "postgresql:///mohonaut?user=postgres"
          # The append-only trigger came back with the data.
          if docker exec pg psql -U postgres -d scratch -c "DELETE FROM audit_log" 2>/dev/null; then
            echo "audit_log accepted a DELETE after restore"; exit 1
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dependency audit
        run: npm audit --audit-level=high
