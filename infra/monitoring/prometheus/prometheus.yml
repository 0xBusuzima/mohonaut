global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  - job_name: indexer
    static_configs:
      - targets: ['127.0.0.1:9464']
  - job_name: keeper
    static_configs:
      - targets: ['127.0.0.1:9465']
  - job_name: api
    static_configs:
      - targets: ['127.0.0.1:9466']
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
