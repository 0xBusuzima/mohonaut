# Service alerts go to the same private Telegram chat as the on-chain alerts.
# The bot token is a file mounted from outside the repository (README.md); the chat id is set here
# when the stack is installed (it is not a secret).
route:
  receiver: telegram
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: telegram
      repeat_interval: 1h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id: -1000000000000 # REPLACE with the alert chat id (groups are negative)
        parse_mode: ''
        message: |-
          [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ end }}
